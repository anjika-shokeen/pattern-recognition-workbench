[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prwb"
version = "1.0.0"
description = "PRWB: an end-to-end Pattern Recognition Workbench (feature extraction, statistical analysis, classification, clustering, performance evaluation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saksham Bakshi" }, { name = "Anjika Shokeen" }]
keywords = ["pattern recognition", "machine learning", "feature extraction", "classification", "clustering"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "pillow>=10.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "nbformat", "nbconvert", "nbclient", "ipykernel"]

[project.scripts]
prwb = "prwb.cli:main"

[tool.setuptools.packages.find]
include = ["prwb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
